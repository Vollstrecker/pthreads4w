name: CI

on:
  push:
  pull_request:

jobs:

  msvc:
    name: msvc-${{ matrix.variant }}-${{ matrix.link }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [C, SE, CE]
        link: [static, shared]

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v1

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -DPTHREADS4W_BUILD_${{ matrix.variant }}=ON
          -DPTHREADS4W_BUILD_SHARED=${{ matrix.link == 'shared' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release -- /verbosity:detailed

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  msys:
    name: msys-${{ matrix.sys }}
    runs-on: ${{ matrix.os || 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64, clangarm64]
        include:
          - sys: clangarm64
            os: windows-11-arm

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            make
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Configure
        if: matrix.sys != 'clang64' && matrix.sys != 'clangarm64'
        run: |
          cmake -G "Unix Makefiles" \
            -S . \
            -B build \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure clang
        if: matrix.sys == 'clang64' || matrix.sys == 'clangarm64'
        run: |
          CC=clang CXX=clang++ \
          cmake -G "Unix Makefiles" \
            -S . \
            -B build \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --output-on-failure --test-dir build
